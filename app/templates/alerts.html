{% extends "base.html" %}
{% block title %}Alerts{% endblock %}
{% block content %}
<div class="page-header mb-4">
  <h1 class="page-title"><i class="bi bi-bell me-2 text-accent"></i>Alerts</h1>
  <p class="page-subtitle text-muted">Prioritized detections requiring analyst attention.</p>
</div>
<div class="card card-dark">
  <div class="card-header"><h2 class="card-title mb-0">Alert queue</h2></div>
  <div class="table-responsive">
    <table class="table table-dark table-hover align-middle mb-0">
      <thead><tr><th>Severity</th><th>IOC</th><th>Score</th><th>Status</th><th>Created</th></tr></thead>
      <tbody id="alerts-table"><tr><td colspan="5" class="text-center text-muted py-5">Loading alerts…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/alerts.js') }}"></script>{% endblock %}
