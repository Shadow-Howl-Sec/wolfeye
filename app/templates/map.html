{% extends "base.html" %}
{% block title %}Threat Map{% endblock %}
{% block content %}
<div class="page-header mb-4">
  <h1 class="page-title"><i class="bi bi-globe2 me-2 text-accent"></i>Threat Map</h1>
  <p class="page-subtitle text-muted">Geographic context from enriched indicators.</p>
</div>
<div class="card card-dark">
  <div class="card-body">
    <div id="threat-map" class="threat-map"></div>
    <p class="text-muted small mt-3 mb-0">Markers appear when enrichment data includes a country or location.</p>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/map.js') }}"></script>{% endblock %}
